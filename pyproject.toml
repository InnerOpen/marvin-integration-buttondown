[project]
name = "marvin-integration-buttondown"
version = "0.3.0"
description = "Buttondown integration for Marvin — newsletter signups become Buttondown subscribers, confirm/unsubscribe sync back, and published issues become Buttondown drafts (or sends)."
readme = "README.md"
requires-python = ">=3.11"
# 0.4: providers contribute webhook signature schemes (the `buttondown` scheme).
dependencies = ["marvin-integration-sdk>=0.4,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

# The seam that makes the plugin discoverable: an installed Marvin scans this group at startup.
[project.entry-points."marvin.integrations"]
buttondown = "marvin_integration_buttondown:ButtondownProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_integration_buttondown"]

# Dev only: resolve the SDK from the sibling checkout. Released builds take it from the index.
[tool.uv.sources]
marvin-integration-sdk = { path = "../MarvinIntegrationSDK", editable = true }

[tool.ruff]
line-length = 150
target-version = "py311"
